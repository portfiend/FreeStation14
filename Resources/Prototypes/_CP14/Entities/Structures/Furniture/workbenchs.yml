- type: entity
  parent:
  - BaseStructure
  id: BaseWorkbench
  abstract: true
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _CP14/Structures/Furniture/workbench.rsi
    state: filler
  - type: Icon
    sprite: _CP14/Structures/Furniture/workbench.rsi
    state: filler
  - type: ActivatableUI
    key: enum.WorkbenchUiKey.Key
    requiresComplex: true
    singleUser: true
  - type: Climbable
  - type: Clickable
  - type: Workbench
    craftSpeed: 1
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.WorkbenchUiKey.Key:
        type: WorkbenchBoundUserInterface
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: PlaceableSurface
  - type: WorkbenchPlaceableProvider
  - type: ItemPlacer
    maxEntities: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false

- type: entity
  parent:
  - BaseWorkbench
  id: Workbench
  name: workbench
  description: Table for the production of various basic tools.
  components:
  - type: Sprite
    state: workbench
  - type: Icon
    state: workbench
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Workbench
    recipeTags:
    - RecipeWorkbench

- type: entity
  id: WorkbenchCooking
  parent:
  - BaseWorkbench
  name: cooking table
  suffix: Workbench
  description: A table to work with food. Time to cook!
  components:
  - type: Sprite
    state: cooking_table
  - type: Icon
    state: cooking_table
  - type: Workbench
    recipeTags:
    - RecipeCooking
